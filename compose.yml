services:
  database:
    container_name: magicolor_database
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: magicolor
      MONGO_INITDB_ROOT_PASSWORD: secret
    ports:
      - "27018:27017"
    restart: always

  # Worker de render (Playwright headless) para el Color Token Extractor Fase 2.
  # La app le delega via RENDERER_URL (default http://localhost:3100).
  renderer:
    container_name: magicolor_renderer
    build: ./workers/color-renderer
    environment:
      PORT: "3100"
      MAX_CONCURRENCY: "3"
      JOB_TIMEOUT_MS: "20000"
      CACHE_TTL_MS: "3600000"
    ports:
      - "3100:3100"
    mem_limit: 1536m
    restart: always
